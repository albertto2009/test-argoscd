apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game
  template:
    metadata:
      labels:
        app: game
    spec:
      containers:
      - name: container
        image: crccheck/hello-world # Imagen simple de un juego web
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gameservice
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: game
